{% extends "base.html" %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        .profile-form {
            margin: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            background-color: #fff;
            text-align: left;
        }

        .profile-form label {
            display: block;
            margin-bottom: 10px;
        }

        .profile-form input[type="text"],
        .profile-form input[type="email"],
        .profile-form input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
        }

        .profile-form input[type="submit"] {
            padding: 10px 20px;
            background-color: peru;
            color: white;
            border: none;
            cursor: pointer;
        }

        .profile-form input[type="submit"]:hover {
            background-color: maroon;
        }
    </style>
</head>
<body>
    <!--header section-->
    {% if not user.is_authenticated %}
        <script>window.location.href = "{% url 'login' %}?next={{ request.path }}";</script>
    {% else %}
    <!--profile section-->
    <section class="profile-form">
        <h2>Profile</h2>
        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}
        <form method="post" action="{% url 'profile' %}">
            {% csrf_token %}
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" value="{{ customer.username }}" readonly>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ customer.email }}" required>
            <label for="phone">Phone:</label>
            <input type="text" id="phone" name="phone" value="{{ customer.phone }}" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <input type="submit" value="Update Profile">
        </form>
    </section>
    {% endif %}
</body>
</html>
{% endblock %}
